*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0}.app{min-height:100vh}.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;align-items:center;gap:10px}.brand{font-weight:900;color:var(--sky2);font-size:20px}.top small{color:var(--muted);margin-left:auto}.main{max-width:1100px;margin:auto;padding:16px 14px 100px}.hero{background:#fff;border:1px solid var(--line);padding:18px;border-radius:12px;margin-bottom:14px}.hero h1{margin:0 0 4px}.gridmenu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.menu{background:#fff;border:1px solid var(--line);min-height:105px;padding:18px;text-align:left;border-radius:10px;font-weight:800;font-size:18px}.menu span{display:block;font-size:34px;margin-bottom:8px}.menu:hover{border-color:var(--sky)}.primary{background:var(--sky);color:#fff;padding:12px 16px;border-radius:8px;font-weight:800}.secondary{background:#fff;border:1px solid var(--line);padding:10px 14px;border-radius:8px}.danger{background:#fee2e2;color:#991b1b}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.product img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#f1f5f9}.product h3{font-size:14px;margin:8px 0 4px}.price{font-weight:900;font-size:17px}.barcode{font-family:monospace;font-size:11px;color:var(--muted);margin-top:3px}.stock{font-size:12px;margin-top:6px}.low{color:#b45309;font-weight:800}.out{color:#dc2626;font-weight:800}.toolbar{display:grid;grid-template-columns:1fr auto;gap:10px;margin:12px 0}.input,select,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:8px;background:#fff}.chips{display:flex;gap:7px;overflow:auto;padding-bottom:5px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:999px}.chip.active{background:#e0f2fe;border-color:var(--sky);color:#0369a1}.fabscan{position:fixed;bottom:14px;left:14px;right:14px;z-index:30;background:var(--sky);color:#fff;padding:16px;border-radius:10px;font-size:18px;font-weight:900;box-shadow:0 6px 20px #0002}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat b{font-size:25px;display:block}.muted{color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;z-index:50;display:flex;align-items:flex-end;justify-content:center}.sheet{background:#fff;width:100%;max-width:650px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.preview{width:150px;height:150px;object-fit:cover;border:1px solid var(--line)}.cartline{display:grid;grid-template-columns:1fr auto auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}.qty button{width:30px;height:30px;border:1px solid var(--line);background:#fff}.total{font-size:25px;font-weight:900}.bottomnav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);z-index:25;display:flex;justify-content:space-around;padding:7px}.bottomnav button{background:none;color:var(--muted);font-size:11px}.bottomnav button strong{display:block;font-size:20px}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(380px,100%);background:#fff;padding:25px;border:1px solid var(--line);border-radius:14px}.pin{font-size:28px;text-align:center;letter-spacing:10px}.toast{position:fixed;top:70px;right:14px;background:#0f172a;color:#fff;padding:12px 14px;border-radius:8px;z-index:100}.camera{width:100%;max-height:55vh;background:#000;object-fit:cover}.ticket{width:80mm;max-width:100%;font-family:monospace;background:#fff;padding:10px;margin:auto}.drag{cursor:grab}.check{font-size:22px}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}
@media(min-width:760px){.gridmenu{grid-template-columns:repeat(3,1fr)}.statgrid{grid-template-columns:repeat(4,1fr)}.bottomnav{display:none}.main{padding-bottom:30px}.fabscan{left:auto;width:240px}.modal{align-items:center}.sheet{border-radius:14px}.toolbar{grid-template-columns:1fr 260px}}

<body><div id="app"></div>
<script>
const SUPABASE_URL='https://gegjljemhkpgwimhzglg.supabase.co';
const SUPABASE_KEY='sb_publishable_YXg507RX3i7TbOPA_ORLGQ_XC45pbes';
const sb=window.supabase?.createClient(SUPABASE_URL,SUPABASE_KEY);
const KEY='despensaJL_local_v2';
const cats=['Todos','Panadería','Almacén','Bebidas','Lácteos','Fiambres','Golosinas','Limpieza','Cigarrillos'];
const demoNames=[
['Pan francés','Panadería',1000,12,5],['Facturas surtidas','Panadería',1500,8,4],['Bizcochos','Panadería',2000,6,3],['Pan lactal','Panadería',2500,10,4],['Prepizza','Panadería',2000,3,5],
['Arroz 1 kg','Almacén',2000,20,8],['Fideos secos 500 g','Almacén',1500,18,6],['Azúcar 1 kg','Almacén',1500,4,8],['Yerba 1 kg','Almacén',5000,12,5],['Aceite 900 ml','Almacén',3000,10,4],['Harina 1 kg','Almacén',1200,15,5],['Sal fina 500 g','Almacén',1000,9,4],['Galletitas surtidas','Almacén',1800,14,5],
['Coca-Cola 2,25 L','Bebidas',3500,12,5],['Pepsi 2,25 L','Bebidas',3000,4,5],['Agua mineral 1,5 L','Bebidas',1500,25,10],['Jugo en polvo','Bebidas',1000,20,8],['Agua saborizada','Bebidas',2000,7,5],['Soda 1,5 L','Bebidas',1200,18,6],
['Leche entera 1 L','Lácteos',2000,10,5],['Leche descremada 1 L','Lácteos',2200,3,5],['Yogur bebible','Lácteos',1800,8,4],['Manteca 200 g','Lácteos',3000,6,3],['Queso cremoso 500 g','Lácteos',5000,4,3],['Postre lácteo','Lácteos',1800,10,4],
['Jamón cocido 100 g','Fiambres',2500,7,4],['Salame 100 g','Fiambres',2800,3,4],['Queso barra 100 g','Fiambres',2200,6,3],['Mortadela 100 g','Fiambres',1800,9,4],['Pate','Fiambres',1500,5,3],
['Alfajor','Golosinas',1200,25,10],['Chocolate','Golosinas',2000,12,5],['Caramelos surtidos','Golosinas',1000,30,10],['Chupetín','Golosinas',800,20,8],['Chicle','Golosinas',700,18,8],['Turrón','Golosinas',1500,2,5],
['Detergente 750 ml','Limpieza',2500,10,4],['Lavandina 1 L','Limpieza',1500,6,5],['Jabón en polvo 800 g','Limpieza',3500,3,4],['Esponja','Limpieza',1000,15,5],['Limpiador multiuso','Limpieza',3000,8,4],['Bolsas de residuos','Limpieza',2000,12,5],
['Cigarrillos paquete','Cigarrillos',4000,10,5],['Encendedor','Cigarrillos',1500,15,5],['Papel para armar','Cigarrillos',2000,4,5],['Fósforos','Cigarrillos',800,20,8],['Cigarrillos unidad','Cigarrillos',500,30,10],
['Pan de hamburguesa','Panadería',2500,8,4],['Pan de molde integral','Panadería',3000,2,4],['Tostadas','Panadería',1800,9,4],['Budín','Panadería',2500,5,3]
];
const state={page:'home',user:null,products:[],cart:[],category:'Todos',stockFilter:'Todos',search:'',purchase:[],closures:[],sales:[],toast:'',cameraStream:null};
function saveLocal(){localStorage.setItem(KEY,JSON.stringify({products:state.products,closures:state.closures,sales:state.sales,purchase:state.purchase,seeded:true}))}
function loadLocal(){try{const x=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(state,{products:x.products||[],closures:x.closures||[],sales:x.sales||[],purchase:x.purchase||[]})}catch{}}
function imgSvg(name,cat){const bg=['#e0f2fe','#fef3c7','#dcfce7','#fce7f3','#ede9fe','#f1f5f9'][Math.floor(Math.random()*6)];return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="600" height="600"><rect width="100%" height="100%" fill="${bg}"/><circle cx="300" cy="260" r="130" fill="#fff"/><text x="300" y="245" text-anchor="middle" font-size="100">📦</text><text x="300" y="440" text-anchor="middle" font-family="Arial" font-size="32" fill="#334155">${name.slice(0,22)}</text><text x="300" y="485" text-anchor="middle" font-family="Arial" font-size="24" fill="#64748b">${cat}</text></svg>`)}
function seed(){if(state.products.length)return;state.products=demoNames.map((p,i)=>({id:'demo-'+i,nombre:p[0],categoria:p[1],precio_venta:p[2],stock:p[3],stock_minimo:p[4],proveedor:'Proveedor '+((i%6)+1),codigo_barras:'779000000'+String(i+1).padStart(4,'0'),foto:imgSvg(p[0],p[1]),demo:true,orden:i,actualizado_en:new Date().toISOString()}));saveLocal()}
async function sync(){if(!sb)return;try{const {data,error}=await sb.from('productos').select('*').order('orden',{ascending:true});if(!error&&data&&data.length){state.products=data;saveLocal()}else if(!error&&!data?.length){await sb.from('productos').insert(state.products.map(({id,...p})=>p))}}catch(e){console.warn(e)}}
function money(n){return '$ '+Number(n||0).toLocaleString('es-AR')}
function toast(t){state.toast=t;render();setTimeout(()=>{state.toast='';render()},2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function nav(p){state.page=p;render()}
function render(){if(!state.user){renderLogin();return}let body='';if(state.page==='home')body=home();if(state.page==='products')body=products();if(state.page==='sales')body=sales();if(state.page==='cash')body=cash();if(state.page==='purchases')body=purchases();if(state.page==='reports')body=reports();if(state.page==='users')body=users();app.innerHTML=`<div class="app"><header class="top"><button class="secondary" onclick="nav('home')">←</button><div class="brand">🏪 DESPENSA JL</div><small>${esc(state.user.nombre)} · ${esc(state.user.rol)}</small></header><main class="main">${body}</main>${state.page==='sales'?'<button class="fabscan" onclick="openScanner()">📷 ESCANEAR</button>':''}<nav class="bottomnav"><button onclick="nav('home')"><strong>⌂</strong>Inicio</button><button onclick="nav('sales')"><strong>🛒</strong>Ventas</button><button onclick="nav('products')"><strong>📦</strong>Productos</button><button onclick="nav('cash')"><strong>💰</strong>Caja</button></nav>${state.toast?`<div class="toast">${esc(state.toast)}</div>`:''}</div>`}
function home(){const low=state.products.filter(p=>Number(p.stock)<=Number(p.stock_minimo)).length;const today=state.sales.filter(s=>new Date(s.fecha).toDateString()===new Date().toDateString()).reduce((a,s)=>a+Number(s.total),0);return `<div class="hero"><h1>Despensa JL</h1><div class="muted">Panel principal</div><div class="statgrid" style="margin-top:12px"><div class="card stat"><span>📦 Bajo stock</span><b>${low}</b></div><div class="card stat"><span>💰 Ventas hoy</span><b>${money(today)}</b></div><div class="card stat"><span>🛒 Productos</span><b>${state.products.length}</b></div><div class="card stat"><span>👤 Usuario</span><b style="font-size:16px">${esc(state.user.nombre)}</b></div></div></div><div class="gridmenu"><button class="menu" onclick="nav('sales')"><span>🛒</span>VENTAS</button><button class="menu" onclick="nav('products')"><span>📦</span>PRODUCTOS</button><button class="menu" onclick="nav('cash')"><span>💰</span>CAJA</button><button class="menu" onclick="nav('purchases')"><span>🛍️</span>COMPRAS</button><button class="menu" onclick="nav('reports')"><span>📊</span>REPORTES</button>${state.user.rol==='Administrador'?'<button class="menu" onclick="nav(\'users\')"><span>👥</span>USUARIOS</button>':''}</div>`}
function products(){let ps=state.products.filter(p=>(state.category==='Todos'||p.categoria===state.category)&&(state.stockFilter==='Todos'||(state.stockFilter==='Bajo'&&p.stock<=p.stock_minimo&&p.stock>0)||(state.stockFilter==='Sin'&&p.stock<=0)||(state.stockFilter==='Con'&&p.stock>p.stock_minimo))).filter(p=>(p.nombre+' '+p.codigo_barras).toLowerCase().includes(state.search.toLowerCase()));return `<div class="row"><h2 style="margin-right:auto">📦 Productos</h2><button class="primary" onclick="productForm()">＋ Nuevo producto</button></div><div class="toolbar"><input class="input" placeholder="🔎 Buscar por nombre o código" value="${esc(state.search)}" oninput="state.search=this.value;render()"><select onchange="state.stockFilter=this.value;render()"><option>Todos</option><option value="Con">Con stock</option><option value="Bajo">Bajo stock</option><option value="Sin">Sin stock</option></select></div><div class="chips">${cats.map(c=>`<button class="chip ${state.category===c?'active':''}" onclick="state.category='${c}';render()">${c}</button>`).join('')}</div><div class="cards" style="margin-top:10px">${ps.map(p=>`<article class="card product"><img src="${p.foto||imgSvg(p.nombre,p.categoria)}"><h3>${esc(p.nombre)}</h3><div class="price">${money(p.precio_venta)}</div><div class="barcode">${esc(p.codigo_barras||'Sin código')}</div><div class="stock ${p.stock<=0?'out':p.stock<=p.stock_minimo?'low':''}">📦 Stock: ${p.stock}</div><div class="row" style="margin-top:8px"><button class="secondary" onclick="productForm('${p.id}')">✏️</button>${state.user.rol==='Administrador'?`<button class="secondary danger" onclick="deleteProduct('${p.id}')">🗑️</button>`:''}</div></article>`).join('')}</div>`}
function productForm(id=''){const p=state.products.find(x=>x.id===id)||{nombre:'',categoria:'Panadería',precio_venta:'',stock:0,stock_minimo:0,proveedor:'',codigo_barras:'',foto:''};showModal(`<h2>${id?'✏️ Editar':'➕ Nuevo'} producto</h2><div class="formgrid"><div class="full"><label>Foto</label><div class="row"><img id="photoPreview" class="preview" src="${p.foto||imgSvg(p.nombre||'Producto',p.categoria)}"><div><input id="photoFile" type="file" accept="image/*" hidden onchange="photoFileChange(this)"><button class="secondary" onclick="document.getElementById('photoFile').click()">🖼️ Galería</button><button class="secondary" onclick="document.getElementById('cameraPhoto').click()">📷 Cámara</button><input id="cameraPhoto" type="file" accept="image/*" capture="environment" hidden onchange="photoFileChange(this)"></div></div></div><label>Nombre<input id="f_nombre" class="input" value="${esc(p.nombre)}"></label><label>Categoría<select id="f_categoria">${cats.slice(1).map(c=>`<option ${p.categoria===c?'selected':''}>${c}</option>`).join('')}</select></label><label>Precio de venta<input id="f_precio" class="input" type="number" value="${p.precio_venta}"></label><label>Stock actual<input id="f_stock" class="input" type="number" value="${p.stock}"></label><label>Stock mínimo<input id="f_min" class="input" type="number" value="${p.stock_minimo}"></label><label>Proveedor (opcional)<input id="f_prov" class="input" value="${esc(p.proveedor||'')}"></label><label class="full">Código de barras<div class="row"><input id="f_code" class="input" value="${esc(p.codigo_barras||'')}"><button class="secondary" onclick="scanForField()">📷</button></div></label></div><div class="row" style="margin-top:14px"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="saveProduct('${id}')">💾 Guardar</button></div>`);window._photo=p.foto||''}
function photoFileChange(inp){const f=inp.files?.[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),s=Math.min(im.width,im.height),x=(im.width-s)/2,y=(im.height-s)/2;c.width=c.height=700;c.getContext('2d').drawImage(im,x,y,s,s,0,0,700,700);window._photo=c.toDataURL('image/jpeg',.82);document.getElementById('photoPreview').src=window._photo};im.src=r.result};r.readAsDataURL(f)}
async function saveProduct(id){const name=document.getElementById('f_nombre').value.trim();if(!name)return toast('El nombre es obligatorio');const old=state.products.find(x=>x.id===id);const p={...(old||{}),id:id||crypto.randomUUID(),nombre:name,categoria:document.getElementById('f_categoria').value,precio_venta:Number(document.getElementById('f_precio').value||0),stock:Number(document.getElementById('f_stock').value||0),stock_minimo:Number(document.getElementById('f_min').value||0),proveedor:document.getElementById('f_prov').value.trim(),codigo_barras:document.getElementById('f_code').value.trim(),foto:window._photo||old?.foto||imgSvg(name,document.getElementById('f_categoria').value),orden:old?.orden??state.products.length,actualizado_en:new Date().toISOString()};if(old)Object.assign(old,p);else state.products.push(p);saveLocal();closeModal();toast('Producto guardado');syncProduct(p);render()}
async function syncProduct(p){if(!sb)return;try{if(String(p.id).startsWith('demo-')){const {data}=await sb.from('productos').select('id').eq('codigo_barras',p.codigo_barras).maybeSingle();if(!data)await sb.from('productos').insert(p)}else await sb.from('productos').upsert(p)}catch(e){console.warn(e)}}
async function deleteProduct(id){const p=state.products.find(x=>x.id===id);if(!p)return;showModal(`<h2>⚠️ ¿Eliminar producto?</h2><p>Se eliminará definitivamente <b>${esc(p.nombre)}</b>.</p><div class="row"><button class="secondary" onclick="closeModal()">CANCELAR</button><button class="primary danger" onclick="confirmDelete('${id}')">🗑️ ELIMINAR</button></div>`)}
async function confirmDelete(id){state.products=state.products.filter(p=>p.id!==id);saveLocal();if(sb)try{await sb.from('productos').delete().eq('id',id)}catch(e){}closeModal();toast('Producto eliminado');render()}
function sales(){return `<div class="row"><h2 style="margin-right:auto">🛒 Ventas</h2><button class="secondary" onclick="clearCart()">Vaciar</button></div><div class="card"><input class="input" placeholder="🔎 Buscar producto" oninput="salesSearch(this.value)"><div id="salesResults"></div></div><div class="card" style="margin-top:10px"><h3>Carrito</h3>${state.cart.length?state.cart.map((x,i)=>`<div class="cartline"><div><b>${esc(x.nombre)}</b><br><span class="muted">${money(x.precio)}</span></div><div class="qty"><button onclick="changeQty(${i},-1)">−</button> ${x.cantidad} <button onclick="changeQty(${i},1)">+</button></div><b>${money(x.precio*x.cantidad)}</b><button onclick="removeCart(${i})">🗑️</button></div>`).join(''):'<p class="muted">Carrito vacío</p>'}<div class="row" style="margin-top:14px"><div class="total" style="margin-right:auto">TOTAL ${money(cartTotal())}</div><button class="primary" onclick="checkout()" ${state.cart.length?'':'disabled'}>💰 COBRAR</button></div></div><div id="salesResults2"></div>`}
function salesSearch(v){const r=document.getElementById('salesResults');if(!r)return;const ps=state.products.filter(p=>(p.nombre+' '+p.codigo_barras).toLowerCase().includes(v.toLowerCase())).slice(0,8);r.innerHTML=ps.map(p=>`<button class="card" style="width:100%;margin-top:7px;text-align:left" onclick="scanConfirm('${p.id}')"><b>${esc(p.nombre)}</b> · ${money(p.precio_venta)} · Stock ${p.stock}</button>`).join('')}
function scanConfirm(id){const p=state.products.find(x=>x.id===id);if(!p)return;showModal(`<h2>Producto encontrado</h2><img class="preview" style="width:100%;height:220px" src="${p.foto}"><h3>${esc(p.nombre)}</h3><div class="price">${money(p.precio_venta)}</div><div>🏷️ ${esc(p.codigo_barras||'')}</div><div>📦 Stock: ${p.stock}</div><div class="row" style="margin-top:15px"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="addCart('${p.id}')">➕ Agregar</button></div>`)}
function addCart(id){const p=state.products.find(x=>x.id===id);if(!p)return;if(p.stock<=0)return toast('Sin stock');const x=state.cart.find(x=>x.id===id);if(x){if(x.cantidad>=p.stock)return toast('No hay más stock');x.cantidad++}else state.cart.push({id:p.id,nombre:p.nombre,precio:Number(p.precio_venta),cantidad:1});closeModal();render()}
function changeQty(i,d){const x=state.cart[i],p=state.products.find(p=>p.id===x.id);x.cantidad=Math.max(1,Math.min(p.stock,x.cantidad+d));render()}function removeCart(i){state.cart.splice(i,1);render()}function clearCart(){state.cart=[];render()}function cartTotal(){return state.cart.reduce((a,x)=>a+x.precio*x.cantidad,0)}
function checkout(){showModal(`<h2>💰 Cobrar</h2><div class="total">Total: ${money(cartTotal())}</div><label>Medio de pago<select id="pay" onchange="toggleCash()"><option>Efectivo</option><option>Transferencia</option><option>Débito</option><option>Crédito</option></select></label><div id="cashFields"><label>Dinero recibido<input id="received" class="input" type="number" oninput="calcChange()"></label><div id="change" class="price">Vuelto: $0</div></div><div class="row" style="margin-top:14px"><button class="secondary" onclick="closeModal()">Cancelar</button><button class="primary" onclick="finishSale()">✅ Confirmar venta</button></div>`)}
function toggleCash(){document.getElementById('cashFields').style.display=document.getElementById('pay').value==='Efectivo'?'block':'none'}function calcChange(){const v=Number(document.getElementById('received').value||0);document.getElementById('change').textContent='Vuelto: '+money(Math.max(0,v-cartTotal()))}
async function finishSale(){const total=cartTotal(),pay=document.getElementById('pay').value,rec=Number(document.getElementById('received')?.value||0);if(pay==='Efectivo'&&rec<total)return toast('El dinero recibido no alcanza');const sale={id:crypto.randomUUID(),fecha:new Date().toISOString(),total,medio_pago:pay,usuario:state.user.nombre,items:state.cart.map(x=>({...x}))};for(const x of state.cart){const p=state.products.find(p=>p.id===x.id);p.stock-=x.cantidad;if(sb)try{await sb.from('productos').update({stock:p.stock,actualizado_en:new Date().toISOString()}).eq('id',p.id)}catch(e){}}state.sales.push(sale);saveLocal();if(sb)try{await sb.from('ventas').insert({producto:'Venta #'+sale.id,cantidad:state.cart.reduce((a,x)=>a+x.cantidad,0),precio:total,total,medio_pago:pay,fecha:sale.fecha})}catch(e){}const cart=[...state.cart];state.cart=[];closeModal();showTicket(sale,cart,rec);render()}
function showTicket(sale,items,rec){showModal(`<div class="ticket"><h2 style="text-align:center">DESPENSA JL</h2><div>${new Date(sale.fecha).toLocaleString('es-AR')}</div><hr>${items.map(x=>`<div>${esc(x.nombre)} x${x.cantidad}<br>${money(x.precio*x.cantidad)}</div>`).join('<hr>')}<hr><b>TOTAL: ${money(sale.total)}</b><div>Pago: ${sale.medio_pago}</div>${sale.medio_pago==='Efectivo'?'<div>Recibido: '+money(rec)+'<br>Vuelto: '+money(rec-sale.total)+'</div>':''}<hr><div style="text-align:center">¡Gracias por su compra!</div></div><div class="row" style="margin-top:12px"><button class="primary" onclick="window.print()">🖨️ IMPRIMIR TICKET</button><button class="secondary" onclick="shareTicket('${sale.id}')">📲 COMPARTIR</button></div>`)}
function shareTicket(id){const s=state.sales.find(x=>x.id===id);const text=`Despensa JL\nTotal: ${money(s.total)}\nPago: ${s.medio_pago}\n${new Date(s.fecha).toLocaleString('es-AR')}`;if(navigator.share)navigator.share({text});else location.href='https://wa.me/?text='+encodeURIComponent(text)}
function cash(){const today=new Date().toDateString();const sales=state.sales.filter(s=>new Date(s.fecha).toDateString()===today);const sum=p=>sales.filter(s=>s.medio_pago===p).reduce((a,s)=>a+s.total,0);return `<h2>💰 Caja</h2><div class="statgrid"><div class="card stat">Ventas hoy<b>${money(sales.reduce((a,s)=>a+s.total,0))}</b></div><div class="card stat">💵 Efectivo<b>${money(sum('Efectivo'))}</b></div><div class="card stat">📲 Transferencias<b>${money(sum('Transferencia'))}</b></div><div class="card stat">💳 Tarjetas<b>${money(sum('Débito')+sum('Crédito'))}</b></div></div><div class="card" style="margin-top:12px"><h3>🔒 Nuevo cierre</h3><div class="formgrid"><label>Efectivo esperado<input id="c_expected" class="input" type="number" value="${sum('Efectivo')}"></label><label>Efectivo contado<input id="c_counted" class="input" type="number"></label><label class="full">Observaciones<textarea id="c_note" placeholder="Observaciones del turno"></textarea></label></div><button class="primary" style="margin-top:10px" onclick="closeCash()">🔒 CERRAR TURNO</button></div><div class="card" style="margin-top:12px"><h3>Historial</h3><div class="row"><input id="d1" class="input" type="date"><input id="d2" class="input" type="date"><button class="secondary" onclick="filterClosures()">Filtrar</button></div><div id="closureList">${closureCards(state.closures)}</div></div>`}
function closeCash(){const expected=Number(document.getElementById('c_expected').value||0),counted=Number(document.getElementById('c_counted').value||0);if(!document.getElementById('c_counted').value)return toast('Ingresá el efectivo contado');const c={id:crypto.randomUUID(),fecha:new Date().toISOString(),usuario:state.user.nombre,efectivo_esperado:expected,efectivo_contado:counted,diferencia:counted-expected,observaciones:document.getElementById('c_note').value};state.closures.unshift(c);saveLocal();if(sb)sb.from('caja').insert({tipo:'cierre',monto:counted,descripcion:JSON.stringify(c),fecha:c.fecha}).then(()=>{});toast('Cierre guardado');render()}
function closureCards(cs){return cs.map((c,i)=>`<div class="card" style="margin-top:8px"><b>🔒 Cierre #${i+1}</b><div class="muted">${new Date(c.fecha).toLocaleString('es-AR')} · ${esc(c.usuario)}</div><div>Esperado: ${money(c.efectivo_esperado)} · Contado: ${money(c.efectivo_contado)} · Diferencia: ${money(c.diferencia)}</div><div>📝 ${esc(c.observaciones||'Sin observaciones')}</div></div>`).join('')||'<p class="muted">Sin cierres.</p>'}
function filterClosures(){const a=document.getElementById('d1').value,b=document.getElementById('d2').value;const cs=state.closures.filter(c=>(!a||c.fecha.slice(0,10)>=a)&&(!b||c.fecha.slice(0,10)<=b));document.getElementById('closureList').innerHTML=closureCards(cs)}
function purchases(){const low=state.products.filter(p=>p.stock<=p.stock_minimo);return `<h2>🛍️ Compras y reposición</h2><div class="card"><h3>📦 Reposición automática</h3><p class="muted">Productos por debajo del mínimo. Vos definís cuánto comprar.</p>${cats.slice(1).map(cat=>{const ps=low.filter(p=>p.categoria===cat);if(!ps.length)return '';return `<h3>${cat}</h3>${ps.map(p=>{const q=state.purchase.find(x=>x.id===p.id)?.cantidad||p.stock_minimo*2||1;return `<div class="row card drag" draggable="true" style="margin:6px 0" ondragstart="dragStart('${p.id}')" ondrop="dragDrop('${p.id}')" ondragover="event.preventDefault()"><div style="flex:1"><b>${esc(p.nombre)}</b><br><span class="muted">Stock ${p.stock} · Mínimo ${p.stock_minimo}</span></div><input class="input" style="width:90px" type="number" value="${q}" onchange="setPurchase('${p.id}',this.value)"><label class="check"><input type="checkbox" onchange="setPurchased('${p.id}',this.checked)"> ☑</label></div>`}).join('')}`}).join('')}<button class="primary" onclick="openPurchase()">🛒 Registrar compra</button></div>`}
function setPurchase(id,q){let x=state.purchase.find(x=>x.id===id);if(!x){x={id,cantidad:Number(q),comprado:false};state.purchase.push(x)}else x.cantidad=Number(q);saveLocal()}function setPurchased(id,v){let x=state.purchase.find(x=>x.id===id)||{id,cantidad:1};x.comprado=v;if(!state.purchase.includes(x))state.purchase.push(x);saveLocal()}
function dragStart(id){window._drag=id}function dragDrop(id){const a=state.products.find(p=>p.id===window._drag),b=state.products.find(p=>p.id===id);if(a&&b){const t=a.orden;a.orden=b.orden;b.orden=t;state.products.sort((x,y)=>x.orden-y.orden);saveLocal();render()}}
function openPurchase(){const lines=state.purchase.filter(x=>x.comprado);if(!lines.length)return toast('Marcá al menos un producto como comprado');showModal(`<h2>🛍️ Registrar compra</h2><label>Proveedor<input id="buyProv" class="input" placeholder="Proveedor"></label><label>Observaciones<textarea id="buyNote"></textarea></label><div>${lines.map(x=>{const p=state.products.find(p=>p.id===x.id);return `<div class="card">${esc(p.nombre)} × ${x.cantidad}</div>`}).join('')}</div><button class="primary" style="margin-top:10px" onclick="finishPurchase()">💾 Guardar compra</button>`)}
function finishPurchase(){for(const x of state.purchase.filter(x=>x.comprado)){const p=state.products.find(p=>p.id===x.id);if(p)p.stock+=Number(x.cantidad)}state.purchase=[];saveLocal();closeModal();toast('Compra registrada y stock actualizado');sync()}
function reports(){const end=new Date(),start=new Date();start.setHours(0,0,0,0);const sales=state.sales.filter(s=>new Date(s.fecha)>=start);const total=sales.reduce((a,s)=>a+s.total,0);const by=p=>sales.filter(s=>s.medio_pago===p).reduce((a,s)=>a+s.total,0);const count=sales.length;const prevStart=new Date(start);prevStart.setDate(prevStart.getDate()-1);const prev=sales.filter(s=>new Date(s.fecha)>=prevStart&&new Date(s.fecha)<start).reduce((a,s)=>a+s.total,0);const pct=prev?Math.round((total-prev)/prev*100):0;const map={};sales.forEach(s=>(s.items||[]).forEach(i=>map[i.nombre]=(map[i.nombre]||0)+i.cantidad));const top=Object.entries(map).sort((a,b)=>b[1]-a[1])[0];return `<h2>📊 Reportes</h2><div class="card"><div class="row"><input class="input" type="date"><input class="input" type="date"><button class="secondary">Aplicar</button></div></div><div class="statgrid" style="margin-top:10px"><div class="card stat">💰 Total vendido<b>${money(total)}</b><span>${pct>=0?'📈 +':'📉 '}${pct}%</span></div><div class="card stat">🧾 Ventas<b>${count}</b></div><div class="card stat">🏆 Más vendido<b style="font-size:16px">${top?esc(top[0]):'—'}</b></div><div class="card stat">📦 Bajo stock<b>${state.products.filter(p=>p.stock<=p.stock_minimo).length}</b></div><div class="card stat">💵 Efectivo<b>${money(by('Efectivo'))}</b></div><div class="card stat">📲 Transferencias<b>${money(by('Transferencia'))}</b></div><div class="card stat">💳 Débito<b>${money(by('Débito'))}</b></div><div class="card stat">💳 Crédito<b>${money(by('Crédito'))}</b></div></div><div class="card" style="margin-top:12px"><h3>Ventas del período</h3>${sales.map(s=>`<div style="padding:9px 0;border-bottom:1px solid var(--line)">${new Date(s.fecha).toLocaleString('es-AR')} · ${esc(s.medio_pago)} · <b>${money(s.total)}</b></div>`).join('')||'<p class="muted">Sin ventas.</p>'}</div>`}
function users(){return `<h2>👥 Usuarios</h2><div class="card"><p><b>Administrador</b> · PIN de ejemplo: <code>1234</code></p><p><b>Vendedor</b> · PIN de ejemplo: <code>1111</code></p><p class="muted">Para producción recomendamos migrar los usuarios a autenticación segura de Supabase; estos PIN son solo para la versión de prueba.</p><button class="primary" onclick="showModal('<h2>➕ Nuevo usuario</h2><p>La administración de usuarios se ampliará en la siguiente iteración.</p><button class=\'secondary\' onclick=\'closeModal()\'>Cerrar</button>')">＋ Nuevo usuario</button></div>`}
function renderLogin(){app.innerHTML=`<div class="login"><div class="loginbox"><div style="text-align:center"><div style="font-size:55px">🏪</div><h1 style="color:var(--sky2)">DESPENSA JL</h1><p class="muted">Elegí usuario e ingresá PIN</p></div><select id="loginUser" class="input"><option value="admin">Administrador</option><option value="vendedor">Vendedor</option></select><input id="loginPin" class="input pin" maxlength="4" inputmode="numeric" placeholder="••••"><button class="primary" style="width:100%;margin-top:10px" onclick="login()">INGRESAR</button><p class="muted" style="font-size:12px">Prueba: Administrador 1234 · Vendedor 1111</p></div></div>`}
function login(){const u=document.getElementById('loginUser').value,p=document.getElementById('loginPin').value;if((u==='admin'&&p==='1234')||(u==='vendedor'&&p==='1111')){state.user={nombre:u==='admin'?'Administrador':'Vendedor',rol:u==='admin'?'Administrador':'Vendedor'};render()}else alert('PIN incorrecto')}
function showModal(html){let m=document.getElementById('modal');if(!m){m=document.createElement('div');m.id='modal';m.className='modal';document.body.appendChild(m)}m.innerHTML='<div class="sheet">'+html+'</div>'}function closeModal(){document.getElementById('modal')?.remove()}
async function openScanner(){showModal('<h2>📷 Escanear producto</h2><video id="cam" class="camera" autoplay playsinline></video><p class="muted">Apuntá al código de barras. Si tu navegador no permite lectura automática, ingresalo manualmente.</p><input id="manualCode" class="input" inputmode="numeric" placeholder="Código de barras"><div class="row" style="margin-top:10px"><button class="secondary" onclick="manualScan()">Buscar código</button><button class="secondary" onclick="closeScanner()">Cerrar</button></div>');try{if(!('BarcodeDetector' in window))throw 0;const det=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128']});state.cameraStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});const v=document.getElementById('cam');v.srcObject=state.cameraStream;const loop=async()=>{if(!document.getElementById('cam'))return;try{const codes=await det.detect(v);if(codes[0]){findCode(codes[0].rawValue);return}}catch{}requestAnimationFrame(loop)};v.onloadeddata=()=>loop()}catch{document.getElementById('cam').style.display='none'}}
function closeScanner(){state.cameraStream?.getTracks().forEach(t=>t.stop());state.cameraStream=null;closeModal()}function manualScan(){const c=document.getElementById('manualCode').value.trim();if(c)findCode(c)}function findCode(c){const p=state.products.find(p=>p.codigo_barras===c);if(!p)return toast('Código no encontrado');closeScanner();scanConfirm(p.id)}function scanForField(){openScannerForField()}function openScannerForField(){showModal('<h2>📷 Escanear código</h2><input id="manualCode" class="input" inputmode="numeric" placeholder="Código"><button class="primary" style="margin-top:10px" onclick="const c=document.getElementById(\'manualCode\').value;document.getElementById(\'f_code\').value=c;closeModal()">Usar código</button>')}
loadLocal();seed();sync();render();
if('serviceWorker' in navigator)navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
